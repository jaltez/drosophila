[workspace]
resolver = "2"
members = [
    "crates/connectome",
    "crates/brain",
    "crates/transduce",
    "crates/world",
    "crates/runlog",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC-BY-4.0"
authors = ["Javier Altez"]
repository = "https://github.com/jaltez/drosophila"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"
