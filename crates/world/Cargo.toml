[package]
name = "world"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
connectome = { path = "../connectome" }
brain = { path = "../brain" }
transduce = { path = "../transduce" }
serde = { workspace = true }
serde_json = { workspace = true }
bevy = { version = "0.19.1", optional = true, default-features = false, features = [
    "2d_bevy_render", "debug", "bevy_sprite", "bevy_winit", "bevy_text", "bevy_ui",
    "bevy_ui_render", "x11", "multi_threaded",
] }

[features]
render = ["dep:bevy"]

[[bin]]
name = "fly_window"
path = "src/bin/fly_window.rs"
required-features = ["render"]
